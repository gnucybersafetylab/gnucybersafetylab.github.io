---
layout: default
title: "Bill of Materials"
nav_active: "build"
tab_active: "car"
---

<style>
  .build-page {
    padding-top: 100px;
  }

  .bom-suppliers-table th:first-child,
  .bom-suppliers-table td:first-child {
    white-space: nowrap;
  }

  @media (min-width: 768px) {
    .bom-suppliers-table {
      min-width: 1180px;
    }

    .bom-suppliers-table th:first-child,
    .bom-suppliers-table td:first-child {
      min-width: 88px;
    }

    .bom-suppliers-table th:nth-child(3),
    .bom-suppliers-table td:nth-child(3),
    .bom-suppliers-table th:nth-child(4),
    .bom-suppliers-table td:nth-child(4) {
      min-width: 140px;
    }
  }

  @media (max-width: 980px) {
    .build-page {
      padding-top: 100px;
    }

    .build-page > .container,
    .build-page .bom-page {
      width: 100dvw;
      max-width: 100dvw;
    }

    .build-page > .container {
      padding-left: 15px;
      padding-right: 15px;
    }

    .bom-page .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
  }
</style>

<main role="main" class="build-page">

  <header id="head" class="secondary">
    <div class="container">
      <h1 class="page-title">Bill of Materials (BOM)</h1>
    </div>
  </header>

  <div class="container">

    <!-- 🔹 Build 상단 서브 탭 -->
    <ul class="nav nav-pills org-nav-tabs">
      <li>
        <a href="{{ '/build/' | relative_url }}">Build Overview</a>
      </li>
      <li class="active">
        <a href="{{ '/build/car_build/' | relative_url }}">Car Build</a>
      </li>
      <li>
        <a href="{{ '/build/jetson_setup/' | relative_url }}">Jetson Setup</a>
      </li>
      <li>
        <a href="{{ '/build/driver_stack/' | relative_url }}">Driver Stack</a>
      </li>
      <li>
        <a href="{{ '/build/drive/' | relative_url }}">Drive</a>
      </li>
    </ul>

    <!-- =============================== -->
    <!-- BOM Content with Supplier Tabs  -->
    <!-- =============================== -->
    <div class="row" style="margin-top: 30px;">
      <div class="col-md-12">
        
        <div class="bom-page">
          <h2 class="build-section-title">RoboRacer 차량 제작 부품 목록</h2>
          
          <p class="lead">
            RoboRacer 차량 제작에 필요한 모든 부품과 재료 목록입니다. 
            각 공급처별로 부품을 구매할 수 있습니다.
          </p>

          <!-- 공급처 탭 -->
          <ul class="nav nav-tabs bom-supplier-tabs" role="tablist" style="margin-top: 30px; margin-bottom: 20px;">
            <li role="presentation" class="active">
              <a href="#suppliers" aria-controls="suppliers" role="tab" data-toggle="tab">
                공급처
              </a>
            </li>
          </ul>

          <!-- 탭 콘텐츠 -->
          <div class="tab-content bom-content">
            <div role="tabpanel" class="tab-pane active" id="suppliers">
              <div id="suppliers-content" class="supplier-content">
                <!-- 통합 공급처 콘텐츠가 여기에 로드됩니다 -->
                <div class="text-center" style="padding: 40px;">
                  <i class="fa fa-spinner fa-spin fa-3x" style="color: #0ecfec;"></i>
                  <p style="margin-top: 20px;">로딩 중...</p>
                </div>
              </div>
            </div>
          </div>

        </div>

      </div>
    </div>

  </div><!-- /.container -->

</main>

<script>
document.addEventListener("DOMContentLoaded", function() {
  var supplierDefinitions = [
    {
      id: 'supplier1',
      name: '공급처 1',
      href: 'https://smartstore.naver.com/motion-x',
      file: '{{ "/build/car_build/supplier1.html" | relative_url }}'
    },
    {
      id: 'supplier2',
      name: '공급처 2',
      file: '{{ "/build/car_build/supplier2.html" | relative_url }}'
    },
    {
      id: 'supplier3',
      name: '공급처 3',
      file: '{{ "/build/car_build/supplier3.html" | relative_url }}'
    }
  ];

  function cellText(cell) {
    return cell ? cell.innerHTML.trim() : '';
  }

  function normalizeTableRows(table) {
    var activeRowspans = [];
    return Array.prototype.map.call(table.querySelectorAll('tbody tr'), function(row) {
      var normalized = [];
      var sourceCells = Array.prototype.slice.call(row.children);
      var sourceIndex = 0;
      var columnIndex = 0;

      while (sourceIndex < sourceCells.length || activeRowspans[columnIndex]) {
        if (activeRowspans[columnIndex]) {
          normalized[columnIndex] = activeRowspans[columnIndex].html;
          activeRowspans[columnIndex].remaining -= 1;
          if (activeRowspans[columnIndex].remaining <= 0) {
            activeRowspans[columnIndex] = null;
          }
          columnIndex += 1;
          continue;
        }

        var cell = sourceCells[sourceIndex];
        var rowspan = parseInt(cell.getAttribute('rowspan') || '1', 10);
        normalized[columnIndex] = cellText(cell);
        if (rowspan > 1) {
          activeRowspans[columnIndex] = {
            html: normalized[columnIndex],
            remaining: rowspan - 1
          };
        }
        sourceIndex += 1;
        columnIndex += 1;
      }

      return normalized;
    });
  }

  function supplierLabel(definition) {
    if (!definition.href) {
      return definition.name;
    }
    return '<a href="' + definition.href + '" target="_blank" rel="noopener noreferrer">' + definition.name + '</a>';
  }

  function mapSupplierRow(definition, row) {
    if (definition.id === 'supplier1') {
      return {
        supplier: supplierLabel(definition),
        category: row[0] || '',
        product: row[1] || '',
        model: row[2] || '',
        spec: row[3] || '',
        quantity: '-',
        price: '-',
        leadTime: row[4] || '',
        note: row[5] || ''
      };
    }

    return {
      supplier: supplierLabel(definition),
      category: '',
      product: row[0] || '',
      model: '',
      spec: '',
      quantity: row[1] || '',
      price: row[2] || '',
      leadTime: '',
      note: row[3] || ''
    };
  }

  function renderTable(rows) {
    var body = rows.map(function(row) {
      return [
        '<tr>',
        '<td>', row.supplier, '</td>',
        '<td>', row.category, '</td>',
        '<td>', row.product, '</td>',
        '<td>', row.model, '</td>',
        '<td>', row.spec, '</td>',
        '<td>', row.quantity, '</td>',
        '<td>', row.price, '</td>',
        '<td>', row.leadTime, '</td>',
        '<td>', row.note, '</td>',
        '</tr>'
      ].join('');
    }).join('');

    return [
      '<h3>공급처 통합 부품 목록</h3>',
      '<p class="text-muted">공급처 1, 공급처 2, 공급처 3의 부품 목록을 하나의 표로 정리했습니다.</p>',
      '<div class="table-responsive" style="margin-top: 20px;">',
      '<table class="table table-bordered table-striped table-hover bom-suppliers-table">',
      '<thead><tr>',
      '<th>공급처</th>',
      '<th>구분</th>',
      '<th>제품 분류 / 부품명</th>',
      '<th>모델명</th>',
      '<th>주요 사양</th>',
      '<th>수량</th>',
      '<th>가격</th>',
      '<th>납기 소요 기간</th>',
      '<th>비고</th>',
      '</tr></thead>',
      '<tbody>', body, '</tbody>',
      '</table>',
      '</div>'
    ].join('');
  }

  function renderError(error) {
    return '<div class="alert alert-warning" style="margin: 20px;"><strong>오류:</strong> ' + error.message + '</div>';
  }

  function loadSuppliers() {
    var targetDiv = document.getElementById('suppliers-content');
    if (!targetDiv) {
      return;
    }

    targetDiv.innerHTML = '<div class="text-center" style="padding: 40px;"><i class="fa fa-spinner fa-spin fa-3x" style="color: #0ecfec;"></i><p style="margin-top: 20px;">로딩 중...</p></div>';

    Promise.all(supplierDefinitions.map(function(definition) {
      return fetch(definition.file)
        .then(function(response) {
          if (!response.ok) {
            throw new Error(definition.name + ' 파일을 찾을 수 없습니다.');
          }
          return response.text();
        })
        .then(function(html) {
          var parser = new DOMParser();
          var doc = parser.parseFromString(html, 'text/html');
          var table = doc.querySelector('.supplier-data table');
          if (!table) {
            return [];
          }
          return normalizeTableRows(table).map(function(row) {
            return mapSupplierRow(definition, row);
          });
        });
    }))
      .then(function(groups) {
        var rows = [];
        groups.forEach(function(group) {
          rows = rows.concat(group);
        });
        targetDiv.innerHTML = renderTable(rows);
      })
      .catch(function(error) {
        targetDiv.innerHTML = renderError(error);
      });
  }

  loadSuppliers();
});
</script>
